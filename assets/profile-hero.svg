<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-labelledby="title desc">
<title id="title">Vemula Syam Prakash — Software Developer</title>
<desc id="desc">A premium dark plum and rose developer banner highlighting Python, backend engineering, AI, cloud and data.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08070b"/><stop offset=".55" stop-color="#180b16"/><stop offset="1" stop-color="#080c13"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f0a6c5"/><stop offset=".52" stop-color="#c56b9b"/><stop offset="1" stop-color="#8b7cf6"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#c56b9b" stop-opacity=".24"/><stop offset="1" stop-color="#c56b9b" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#bda1b7" stroke-opacity=".075"/></pattern>
  <filter id="soft"><feGaussianBlur stdDeviation="2.5"/></filter>
  <style>.orbit{animation:orbit 10s linear infinite}.pulse{animation:pulse 5s ease-in-out infinite}@keyframes orbit{to{stroke-dashoffset:-360}}@keyframes pulse{50%{opacity:.48;transform:translateY(-7px)}}</style>
</defs>
<rect width="1280" height="430" rx="26" fill="url(#bg)"/>
<rect x="1" y="1" width="1278" height="428" rx="25" fill="url(#grid)" stroke="#5b354d" stroke-opacity=".78"/>
<circle cx="1020" cy="210" r="260" fill="url(#glow)"/>
<g opacity=".9" fill="none" stroke="url(#accent)">
  <path class="orbit" d="M730 352 C835 262 895 317 968 223 S1115 102 1220 162" stroke-width="2.5" stroke-dasharray="12 10"/>
  <path d="M770 375 L890 278 L1000 330 L1102 228 L1195 266" stroke-opacity=".3" stroke-width="1.5"/>
  <circle cx="890" cy="278" r="5" fill="#f0a6c5" stroke="none"/><circle cx="1102" cy="228" r="5" fill="#c56b9b" stroke="none"/><circle cx="1220" cy="162" r="5" fill="#8b7cf6" stroke="none"/>
</g>
<g class="pulse" transform="translate(1020 82)" fill="none" stroke="#d78fb3" stroke-opacity=".72">
  <circle cx="78" cy="78" r="58"/><circle cx="78" cy="78" r="34"/><circle cx="78" cy="78" r="8" fill="#d78fb3" fill-opacity=".2"/>
  <path d="M78 0V22M78 134V156M0 78H22M134 78H156M23 23L39 39M117 117L133 133M117 39L133 23M23 133L39 117" stroke-width="2"/>
</g>
<g font-family="Inter,Segoe UI,Arial,sans-serif">
  <text x="68" y="72" font-size="14" letter-spacing="4" fill="#e9a9c7">SOFTWARE ENGINEERING · AI · CLOUD · DATA</text>
  <text x="64" y="151" font-size="49" font-weight="750" fill="#fbf4f8">Vemula Syam Prakash</text>
  <rect x="68" y="178" width="610" height="2" rx="1" fill="url(#accent)"/>
  <text x="68" y="224" font-size="23" font-weight="600" fill="#f3d9e7">Python · Backend · AI/ML &amp; GenAI · AWS · Data Engineering</text>
  <text x="68" y="265" font-size="17" fill="#c5b7c2">MCA graduate building practical software, intelligent systems</text>
  <text x="68" y="291" font-size="17" fill="#c5b7c2">and dependable data workflows — from implementation to deployment.</text>
  <g transform="translate(68 331)">
    <rect width="390" height="43" rx="21.5" fill="#170d18" stroke="#70435e"/>
    <circle cx="23" cy="21.5" r="5" fill="#83ddb5"/>
    <text x="39" y="27" font-size="14" fill="#f1dce8">Build thoughtfully  /  Learn deeply  /  Ship responsibly</text>
  </g>
</g>
</svg>